plugins {
    id 'com.android.application'
}

def devKeyBase64 = rootProject.file("signing/dev-keystore.p12.b64")
def devKeyStore = rootProject.file("build/dev-signing/grocery-spike-dev.p12")

tasks.register("prepareStableDevKeystore") {
    inputs.file(devKeyBase64)
    outputs.file(devKeyStore)
    doLast {
        devKeyStore.parentFile.mkdirs()
        devKeyStore.bytes = java.util.Base64.getDecoder().decode(devKeyBase64.text.trim())
    }
}

android {
    namespace 'com.groceryoptimizer.spike'
    compileSdk 35

    defaultConfig {
        applicationId "com.groceryoptimizer.spike"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "0.8-mobile-spike"
    }

    signingConfigs {
        stableDev {
            storeFile devKeyStore
            storePassword "grocery-spike-dev"
            keyAlias "grocery-spike-dev"
            keyPassword "grocery-spike-dev"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stableDev
        }
        debug {
            debuggable true
            signingConfig signingConfigs.stableDev
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("prepareStableDevKeystore")
}
