plugins {
    id 'com.android.application'
}

android {
    namespace 'com.groceryoptimizer.spike'
    compileSdk 35

    defaultConfig {
        applicationId "com.groceryoptimizer.spike"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.3-mobile-spike"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
