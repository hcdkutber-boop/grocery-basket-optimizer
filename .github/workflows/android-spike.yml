name: Build Android spike

on:
  push:
    paths:
      - "android-spike/**"
      - ".github/workflows/android-spike.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-spike assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grocery-optimizer-spike-0.7
          path: android-spike/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
