name: Build virtualization spike

on:
  push:
    paths:
      - ".github/workflows/virtualization-spike.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Clone pinned BlackBox
        run: |
          git clone https://github.com/Black00Z/Blacks-BlackBox.git virtualization-engine
          cd virtualization-engine
          git checkout 40282a7bf4500948cfd598fc67e6e63114b26dd9

      - name: Prefer primary Maven repositories
        working-directory: virtualization-engine
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://www.jitpack.io" }
                  maven { url 'https://maven.aliyun.com/repository/releases' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/central' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://www.jitpack.io" }
                  maven { url 'https://maven.aliyun.com/repository/releases' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/central' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
              }
          }

          rootProject.name = "NewBlackbox"

          include ':app'
          include ':blackbox-gallery-stub'
          include(":black-reflection")
          include(":compiler")
          include ':Bcore'
          EOF

      - name: Build debug APK
        working-directory: virtualization-engine
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          find virtualization-engine/app/build/outputs/apk -type f -name "*.apk" -exec cp {} out/ \;
          cp virtualization-engine/LICENSE out/BLACKS_BLACKBOX_LICENSE.txt
          printf '%s\n' \
            'Source: https://github.com/Black00Z/Blacks-BlackBox' \
            'Pinned commit: 40282a7bf4500948cfd598fc67e6e63114b26dd9' \
            'Purpose: compatibility test only; no X5 APK bundled.' \
            > out/BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grocery-virtualization-spike-0.1
          path: out/*
          if-no-files-found: error
