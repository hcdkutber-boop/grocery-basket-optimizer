name: Build virtualization spike

on:
  push:
    paths:
      - ".github/workflows/virtualization-spike.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Clone pinned BlackBox
        run: |
          git clone https://github.com/Black00Z/Blacks-BlackBox.git virtualization-engine
          cd virtualization-engine
          git checkout 40282a7bf4500948cfd598fc67e6e63114b26dd9

      - name: Build debug APK
        working-directory: virtualization-engine
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          find virtualization-engine/app/build/outputs/apk -type f -name "*.apk" -exec cp {} out/ \;
          cp virtualization-engine/LICENSE out/BLACKS_BLACKBOX_LICENSE.txt
          printf '%s\n' \
            'Source: https://github.com/Black00Z/Blacks-BlackBox' \
            'Pinned commit: 40282a7bf4500948cfd598fc67e6e63114b26dd9' \
            'Purpose: compatibility test only; no X5 APK bundled.' \
            > out/BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grocery-virtualization-spike-0.1
          path: out/*
          if-no-files-found: error
